{% extends "layout.html" %}
{% block content %}

<h1>Edit Listing</h1>

<form id="edit-listing-form" method="post" action="{{ url_for('edit_listing', listing_id=item.id) }}" class="pure-form pure-form-stacked" enctype="multipart/form-data">
	<fieldset>
		<label for="title">Title</label>
		<input required minlength="3" type="text" id="title" name="title" value="{{ item.title }}">

		<label for="location">Address</label>
		<gmp-place-autocomplete id="location" placeholder="{{ item.address }}"></gmp-place-autocomplete>
		<input type="hidden" name="address" id="address" value="{{ item.address }}">
		<input type="hidden" name="location" id="location_point">
		<p id="address-error" class="form-error" role="alert"></p>

		<label for="monthly_rent">Monthly rent</label>
		<input required min="0" step="1" type="number" id="monthly_rent" name="monthly_rent" value="{{ item.rent }}">

		<label for="lease_start_date">Lease start date</label>
		<input required type="date" id="lease_start_date" name="lease_start_date" value="{{ item.leasestart }}">

		<label for="lease_end_date">Lease end date</label>
		<input required type="date" id="lease_end_date" name="lease_end_date" value="{{ item.leaseend }}">

		<label for="description">Description</label>
		<textarea required id="description" name="description" rows="5">{{ item.description }}</textarea>

		<label for="images">Images</label>
		<div id="existing-images" class="image-preview-list">
			{% for image in images %}
			<div class="image-preview-item" data-existing-image>
				<img src="{{ image.image_url }}" alt="{{ image.alt_text or item.title }}">
				<span>{{ image.alt_text or "Image" }}</span>
				<button type="button" class="pure-button button-danger image-remove-button" data-image-id="{{ image.id }}">Remove</button>
			</div>
			{% endfor %}
		</div>
		<input type="file" id="images" name="images" accept="image/*" aria-describedby="images-help image-error" multiple>
		<p id="images-help" class="form-help">A listing can have up to 10 images.</p>
		<div id="image-preview" class="image-preview-list" aria-live="polite"></div>
		<p id="image-error" class="form-error" role="alert"></p>

		<button id="save-listing-button" type="submit" class="pure-button pure-button-primary">Save Changes</button>
		<button type="button" class="pure-button" onclick="history.back()">Cancel</button>
	</fieldset>
</form>

<script>
	const form = document.getElementById("edit-listing-form");
	const start = document.getElementById("lease_start_date");
	const end = document.getElementById("lease_end_date");
	const address = document.getElementById("address");
    const addressError = document.getElementById("address-error");

	async function initAutocomplete() {
        await google.maps.importLibrary("places");
        const placeAutocomplete = document.getElementById('location');
        placeAutocomplete.addEventListener(
        'gmp-select',
        async ({ placePrediction }) => {
            address.value = "";
			document.getElementById("location_point").value = "";
            const place = placePrediction.toPlace();
            await place.fetchFields({
                fields: ['formattedAddress','location'],
        });
            if (place.formattedAddress && place.location) {
                address.value = place.formattedAddress;
                document.getElementById("location_point").value = `POINT(${place.location.lng()} ${place.location.lat()})`;
                addressError.textContent = "";
                console.log("Address selected:", address.value);
            }
        });

       placeAutocomplete.addEventListener("input", () => {
            address.value = "";
            document.getElementById("location_point").value = "";
        });

        // Require a selected Google address
        form.addEventListener("submit", (event) => {
            if (!address.value) {
                event.preventDefault();
                addressError.textContent = "Please select an address from Google's suggestions.";
            }
        });
    }
	
	function validateDates() {
		end.min = start.value;
		const invalid =
			start.value &&
			end.value &&
			end.value < start.value;

		end.setCustomValidity(
			invalid
				? "End date cannot be earlier than start date."
				: ""
		);

		if (invalid) {
			end.reportValidity();
		}
	}
	start.addEventListener("change", validateDates);
	end.addEventListener("change", validateDates);
	validateDates();

	const MAX_IMAGES = 10;
	const imageInput = document.getElementById("images");
	const imagePreview = document.getElementById("image-preview");
	const imageError = document.getElementById("image-error");
	const saveButton = document.getElementById("save-listing-button");
	const selectedImages = [];

	function imageKey(file) {
		return `${file.name}:${file.size}:${file.lastModified}`;
	}

	function existingImageCount() {
		return document.querySelectorAll("[data-existing-image]").length;
	}

	function syncImageInput() {
		const transfer = new DataTransfer();
		selectedImages.forEach(({ file }) => transfer.items.add(file));
		imageInput.files = transfer.files;
	}

	function renderImagePreviews() {
		imagePreview.replaceChildren();
		selectedImages.forEach(({ file, previewUrl }, index) => {
			const item = document.createElement("div");
			item.className = "image-preview-item";

			const image = document.createElement("img");
			image.src = previewUrl;
			image.alt = `Preview of ${file.name}`;

			const fileName = document.createElement("span");
			fileName.textContent = file.name;

			const removeButton = document.createElement("button");
			removeButton.type = "button";
			removeButton.className = "pure-button button-danger image-remove-button";
			removeButton.textContent = "Remove";
			removeButton.addEventListener("click", () => {
				const [removed] = selectedImages.splice(index, 1);
				URL.revokeObjectURL(removed.previewUrl);
				imageError.textContent = "";
				syncImageInput();
				renderImagePreviews();
			});

			item.append(image, fileName, removeButton);
			imagePreview.append(item);
		});
	}

	document.querySelectorAll("[data-image-id]").forEach((button) => {
		button.addEventListener("click", () => {
			const input = document.createElement("input");
			input.type = "hidden";
			input.name = "delete_image_ids";
			input.value = button.dataset.imageId;
			form.append(input);
			button.closest("[data-existing-image]").remove();
			imageError.textContent = "";
		});
	});

	imageInput.addEventListener("change", () => {
		const newFiles = Array.from(imageInput.files);
		if (newFiles.length === 0) {
			syncImageInput();
			return;
		}

		const existingKeys = new Set(selectedImages.map(({ file }) => imageKey(file)));
		let rejectedType = false;
		let exceededLimit = false;

		newFiles.forEach((file) => {
			if (!file.type.startsWith("image/")) {
				rejectedType = true;
				return;
			}
			if (existingKeys.has(imageKey(file))) {
				return;
			}
			if (existingImageCount() + selectedImages.length >= MAX_IMAGES) {
				exceededLimit = true;
				return;
			}
			selectedImages.push({
				file,
				previewUrl: URL.createObjectURL(file),
			});
			existingKeys.add(imageKey(file));
		});

		imageError.textContent = exceededLimit
			? "A listing can have at most 10 images."
			: rejectedType
				? "Only image files can be uploaded."
				: "";
		syncImageInput();
		renderImagePreviews();
	});

	form.addEventListener("submit", (event) => {
		syncImageInput();
		if (existingImageCount() + selectedImages.length > MAX_IMAGES) {
			event.preventDefault();
			imageError.textContent = "A listing can have at most 10 images.";
			return;
		}
		saveButton.disabled = true;
		saveButton.textContent = "Saving Changes...";
	});
</script>
<script async src="{{ google_maps_url }}"></script>

{% endblock %}
