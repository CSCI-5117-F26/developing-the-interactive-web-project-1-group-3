{% extends "layout.html" %}
{% block content %}


<div class="search-bar">
    <form action="/search" method="GET" class="pure-form">
        <input type="text" name="q" placeholder="search housing..." class="pure-input-rounded">
        <button class="pure-button pure-button-primary">Search</button>
    </form>
</div>



<div class="pure-g">
        {% for listing in listings %}
        <div class="pure-u-1-2">
            <div class="listing-card">
                <div class="img-placeholder"></div>
                <h2>{{ listing.title }}</h2>
                <p>{{ listing.rent }}</p>
        
                <a href="{{ url_for('listing', listing_id=listing.id) }}" class="pure-button">View Listing</a>
                <a href="{{ url_for('edit_listing', listing_id=listing.id) }}" class="pure-button">Edit Post</a>
                <form method="post" action="{{ url_for('delete_listing', listing_id=listing.id) }}" onsubmit="return confirm('Are you sure you want to delete this post?')">
                    <button type="submit" class="pure-button button-danger">Delete Post</button>
                </form>
            </div>
        </div>
        {% endfor %}




</div>





{% endblock %}
