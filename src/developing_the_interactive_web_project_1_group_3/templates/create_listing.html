{% extends "layout.html" %}
{% block content %}
<h1>Create Listing</h1>

<form id="create-listing-form" method="post" action="{{ url_for('create_listing') }}" class="pure-form pure-form-stacked" enctype="multipart/form-data" novalidate>
    <fieldset>
        <div class="pure-control-group">
            <label for="title"> Title</label>
            <input required minlength="3" type="text" id="title" name='title'
                placeholder="Title" />

            <label for="location">Address</label>
            <gmp-place-autocomplete id="location"></gmp-place-autocomplete>
            <input type="hidden" name="address" id="address">
            <input type="hidden" name="latitude" id="latitude">
            <input type="hidden" name="longitude" id="longitude">
            <p id="address-error" class="form-error" role="alert"></p>
            
            <label for="monthly_rent" >Monthly rent</label>
            <input name="monthly_rent" min="0" step="1" type="number" id="monthly-rent" placeholder="Enter Monthly rent" class="pure-input-1" required>

            <label for="lease_start_date">Lease start date</label>
            <input type="date" id="lease_start_date" name="lease_start_date" required>

            <label for="lease_end_date">Lease end date</label>
            <input type="date" id="lease_end_date" name="lease_end_date" required>
            <p id="date-error" class="form-error" role="alert"></p>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5" required></textarea>

            <label for="images">Upload Images</label>
            <input
                type="file"
                id="images"
                name="images"
                accept="image/*"
                aria-describedby="images-help image-error"
                multiple
            >
            <p id="images-help" class="form-help">Select up to 10 images. You can add images in multiple selections.</p>
            <div id="image-preview" class="image-preview-list" aria-live="polite"></div>
            <p id="image-error" class="form-error" role="alert"></p>
        </div>
        <button id="create-listing-button" type="submit" class="pure-button pure-button-primary">
            Create Listing
        </button>
        <button type="button" class="pure-button" onclick="history.back()">Cancel</button>
    </fieldset>
</form>

<script>
    const form = document.getElementById("create-listing-form");
    const address = document.getElementById("address");
    const addressError = document.getElementById("address-error");
    const submitButton = document.getElementById("create-listing-button");

    function typedAddress() {
        const placeAutocomplete = document.getElementById("location");
        const input = placeAutocomplete?.shadowRoot?.querySelector("input");
        return (input?.value || "").trim();
    }

    async function initAutocomplete() {
        await google.maps.importLibrary("places");
        const placeAutocomplete = document.getElementById('location');
        placeAutocomplete.addEventListener(
        'gmp-select',
        async ({ placePrediction }) => {
            const place = placePrediction.toPlace();
            await place.fetchFields({
                fields: ['formattedAddress','location'],
        });
            address.value = place.formattedAddress;
            addressError.textContent = "";
        // document.getElementById('latitude').value = place.location.lat();
            //document.getElementById('longitude').value = place.location.lng();
        });

        //Keep a manually typed address when no suggestion is selected
        placeAutocomplete.addEventListener("input", () => {
            address.value = typedAddress();
            addressError.textContent = "";
            //document.getElementById("latitude").value = "";
            //document.getElementById("longitude").value = "";
            console.log("Address edited");
        });
    }

    const start = document.getElementById("lease_start_date");
    const end = document.getElementById("lease_end_date");
    const dateError = document.getElementById("date-error");

    function validateDates(showMessage = false) {
        end.min = start.value;
        const invalid = Boolean(
            start.value &&
            end.value &&
            end.value < start.value
        );

        end.setCustomValidity(
            invalid
                ? "End date cannot be earlier than start date."
                : ""
        );
        dateError.textContent = invalid
            ? "End date cannot be earlier than start date."
            : "";

        if (invalid && showMessage) {
            end.reportValidity();
        }
        return !invalid;
    }

    start.addEventListener("change", validateDates);
    end.addEventListener("change", validateDates);
    validateDates();

    const MAX_IMAGES = 10;
    const imageInput = document.getElementById("images");
    const imagePreview = document.getElementById("image-preview");
    const imageError = document.getElementById("image-error");
    const selectedImages = [];

    function imageKey(file) {
        return `${file.name}:${file.size}:${file.lastModified}`;
    }

    function syncImageInput() {
        const transfer = new DataTransfer();
        selectedImages.forEach(({ file }) => transfer.items.add(file));
        imageInput.files = transfer.files;
    }

    function renderImagePreviews() {
        imagePreview.replaceChildren();

        selectedImages.forEach(({ file, previewUrl }, index) => {
            const item = document.createElement("div");
            item.className = "image-preview-item";

            const image = document.createElement("img");
            image.src = previewUrl;
            image.alt = `Preview of ${file.name}`;

            const fileName = document.createElement("span");
            fileName.textContent = file.name;

            const removeButton = document.createElement("button");
            removeButton.type = "button";
            removeButton.className = "pure-button button-danger image-remove-button";
            removeButton.textContent = "Remove";
            removeButton.setAttribute("aria-label", `Remove ${file.name}`);
            removeButton.addEventListener("click", () => {
                const [removed] = selectedImages.splice(index, 1);
                URL.revokeObjectURL(removed.previewUrl);
                imageError.textContent = "";
                syncImageInput();
                renderImagePreviews();
            });

            item.append(image, fileName, removeButton);
            imagePreview.append(item);
        });
    }

    imageInput.addEventListener("change", () => {
        const newFiles = Array.from(imageInput.files);

        if (newFiles.length === 0) {
            syncImageInput();
            return;
        }

        const existingKeys = new Set(
            selectedImages.map(({ file }) => imageKey(file))
        );
        let rejectedType = false;
        let exceededLimit = false;

        newFiles.forEach((file) => {
            if (!file.type.startsWith("image/")) {
                rejectedType = true;
                return;
            }
            if (existingKeys.has(imageKey(file))) {
                return;
            }
            if (selectedImages.length >= MAX_IMAGES) {
                exceededLimit = true;
                return;
            }

            selectedImages.push({
                file,
                previewUrl: URL.createObjectURL(file),
            });
            existingKeys.add(imageKey(file));
        });

        if (exceededLimit) {
            imageError.textContent = "You can upload a maximum of 10 images.";
        } else if (rejectedType) {
            imageError.textContent = "Only image files can be uploaded.";
        } else {
            imageError.textContent = "";
        }

        syncImageInput();
        renderImagePreviews();
    });

    window.addEventListener("beforeunload", () => {
        selectedImages.forEach(({ previewUrl }) => {
            URL.revokeObjectURL(previewUrl);
        });
    });

    form.addEventListener("submit", (event) => {
        if (!address.value.trim()) {
            address.value = typedAddress();
        }
        syncImageInput();
        const datesAreValid = validateDates(true);

        const fieldsAreValid = form.checkValidity();
        if (!fieldsAreValid) {
            form.reportValidity();
        }

        if (!datesAreValid || !fieldsAreValid) {
            event.preventDefault();
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Creating Listing...";
    });
</script>
<script async src="{{ google_maps_url }}"></script>
{% endblock %}
