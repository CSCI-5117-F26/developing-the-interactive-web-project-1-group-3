<div class="pure-g">
    {% for listing in listings %}
    <div class="pure-u-1-2">
        <div class="listing-card favorite-card">
            <span class="favorite-heart" aria-hidden="true">❤️</span>
            <div class="img-placeholder"></div>
            <h2>{{ listing.title }}</h2>
            <p><strong>Address:</strong> {{ listing.address }}</p>
            <p>${{ listing.rent }}/month</p>
            <a href="{{ url_for('listing', listing_id=listing.id) }}" class="pure-button">View Listing</a>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
